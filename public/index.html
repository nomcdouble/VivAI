<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VivAI Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    .white-bg {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 1;
    }

    /* ─── BLACK CHUNKS - FASTER TIMELINE ─── */
    .chunk {
      position: fixed;
      top: 0;
      height: 100vh;
      width: 20vw;
      background: #000000;
      z-index: 10;
    }
    .c1 { left: 0%; animation: slideDown 0.9s cubic-bezier(0.5, 0, 1, 1) 2.4s forwards; }
    .c2 { left: 20%; animation: slideDown 0.9s cubic-bezier(0.5, 0, 1, 1) 2.6s forwards; }
    .c3 { left: 40%; animation: slideDown 0.9s cubic-bezier(0.5, 0, 1, 1) 2.8s forwards; }
    .c4 { left: 60%; animation: slideDown 0.9s cubic-bezier(0.5, 0, 1, 1) 3.0s forwards; }
    .c5 { left: 80%; animation: slideDown 0.9s cubic-bezier(0.5, 0, 1, 1) 3.2s forwards; }

    @keyframes slideDown {
      to {
        transform: translateY(100vh);
      }
    }

    /* ─── FINAL BLACK OVERLAY - FASTER ─── */
    .final-black {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      opacity: 0;
      animation: fadeBlack 1.2s ease 4.6s forwards;
    }

    @keyframes fadeBlack {
      to {
        opacity: 1;
      }
    }

    /* ─── SVG FADE IN & OUT ─── */
    .logo-container {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 400px;
      height: auto;
      animation: fadeInLogo 0.8s ease 0.1s forwards, fadeOutContent 0.8s ease 2.2s forwards;
    }

    @keyframes fadeInLogo {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeOutContent {
      to {
        opacity: 0;
      }
    }

    /* ─── DOUBLE STROKE DRAWING ANIMATION ─── */
    .stroke-layer {
      fill: none;
      stroke: #ffffff;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 4000;   /* will be set dynamically */
      stroke-dashoffset: 4000;
      animation: drawStroke 2.0s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;
    }

    .stroke-thin {
      stroke-width: 3;
    }

    .stroke-thick {
      stroke-width: 7;
    }

    @keyframes drawStroke {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* ─── STARTING DOT ─── */
    .start-dot {
      fill: #ffffff;
      animation: startDotAnim 1.2s ease-out 0.0s forwards;
    }

    @keyframes startDotAnim {
      0% {
        r: 10;
        opacity: 1;
      }
      60% {
        r: 24;
        opacity: 0.8;
      }
      100% {
        r: 0;
        opacity: 0;
      }
    }
  </style>
</head>
